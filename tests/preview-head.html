<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap">
<style>
body{margin:0;background:#111;font-family:-apple-system,"Hiragino Sans",sans-serif}
#root{display:grid;grid-template-columns:repeat(3,300px);gap:16px;padding:16px}
.lock{background:#3D4A6B;border-radius:24px;color:#fff;padding:14px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cap{font-size:11px;color:#FFD9A0;align-self:flex-start}
.inline{height:20px;max-width:260px;overflow:hidden;font-size:13px;opacity:.9}
.clock{font-size:64px;font-weight:700;line-height:1}
.row{display:flex;gap:10px;margin-top:6px}
.rect{width:170px;height:76px;box-sizing:border-box;padding:4px 6px;overflow:hidden}
.rect>div{height:100%}
.circ{width:76px;height:76px;border-radius:50%;overflow:hidden}
.circ>div{height:100%;border-radius:50%}
</style>
<div id="root"></div>
